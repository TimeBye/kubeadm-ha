- block:
  - name: 准备 Docker 相关目录
    file: 
      name: "{{ item }}"
      state: directory
    with_items:
    - /etc/docker
    - /etc/containerd
    - "{{ docker_storage_dir }}"
    - /etc/systemd/system/docker.service.d
  
  - name: 检查本地是否已有 Docker 安装包
    stat:
      path: "{{ playbook_dir }}/roles/prepare/container-engine/files/docker-{{ docker_version }}.{{ ansible_facts['architecture'] }}.tgz"
    register: local_docker
    run_once: true
    delegate_to: localhost
    become: false

  - name: 下载 Docker 到 Ansible 控制机
    get_url:
      url: "{{ docker_download_url }}"
      dest: "{{ playbook_dir }}/roles/prepare/container-engine/files/docker-{{ docker_version }}.{{ ansible_facts['architecture'] }}.tgz"
      checksum: "sha256:{{ docker_sha256[ansible_facts['architecture']] }}"
    run_once: true
    delegate_to: localhost
    become: false
    when: not local_docker.stat.exists
  
  - name: 分发 Docker 到各节点
    copy:
      src: "docker-{{ docker_version }}.{{ ansible_facts['architecture'] }}.tgz"
      dest: "/tmp/docker-ce.tgz"
  
  - name: 解压 Docker 安装包
    shell: >
      tar zxf /tmp/docker-ce.tgz -C /tmp
  
  - name: 复制 Docker 二进制文件至 PATH 目录下
    copy:
      src: "/tmp/docker/{{ item }}"
      dest: "/usr/bin/{{ item }}"
      mode: 0755
      remote_src: true
    with_items:
      - containerd
      - containerd-shim-runc-v2
      - ctr
      - docker
      - dockerd
      - docker-init
      - docker-proxy
      - runc
  
  - name: 生成 Docker systemd unit 配置文件
    template:
      src: "docker/{{ item }}.j2"
      dest: "/etc/systemd/system/{{ item }}"
      mode: 0644
    with_items:
      - docker.service
      - docker.socket
      - containerd.service
  
  - name: 编写 Containerd 配置
    template:
      src: docker/config.toml.j2
      dest: /etc/containerd/config.toml
      owner: root
      mode: 0644

  - name: 编写 Docker 代理配置
    template:
      src: http-proxy.conf.j2
      dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    when: http_proxy is defined or https_proxy is defined
  
  - name: 创建 Docker 用户组
    group:
      name: docker
      state: present
  
  - name: 添加当前用户到 Docker 用户组
    user:
      name: "{{ ansible_user }}"
      groups: docker
      append: yes
  when: 
  - docker_already_running.stdout != "active"
  - containerd_already_running.stdout != "active"

- name: 编写 Docker 配置是否有修改
  template:
    src: docker/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    mode: 0644
  register: configuration_result

- name: 重新加载 daemon
  systemd:
    daemon_reload: yes

- name: 设置 Docker 开机自启并启动
  service:
    name: docker
    state: started
    enabled: yes

- name: 强制启动/重启 Docker
  service:
    name: docker
    state: restarted
    enabled: yes
  when: 
  - configuration_result.changed
  - "restart_container_manager_force | default(True) | bool"

- block:
  - name: 需手动重启 Docker 
    vars: 
      msg: |
        节点：{{ inventory_hostname }} ，Docker 处于运行中，
        但 Docker 配置文件 /etc/docker/daemon.json 已更新，
        请在集群安装完成后手动执行下面命令重启该节点 docker 与 kubelet：
            systemctl restart docker
            systemctl restart kubelet
        
        若重启后 kubelet 无法正常启动：
        请确认以下两个文件中 cgroup driver 参数是否设置为 systemd，
        若不是则修改为 systemd 后再次重启 kubelet。
            vi /var/lib/kubelet/config.yaml
            vi /var/lib/kubelet/kubeadm-flags.env
        在 /var/lib/kubelet/config.yaml 文件中参数名为：cgroupDriver；
        在 /var/lib/kubelet/kubeadm-flags.env 文件中参数名为：--cgroup-driver，若参数不存在请忽略。

    debug: 
      msg: "{{ msg.split('\n') }}"

  - name: 等待用户查看日志
    shell: sleep 60
    run_once: true
  when: 
  - configuration_result.changed
  - '"active" in docker_already_running.stdout'
  - "not (restart_container_manager_force | default(True) | bool)"
