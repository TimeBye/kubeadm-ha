- name: 检查本地是否已有 cri-dockerd 安装包
  stat:
    path: "{{ playbook_dir }}/roles/prepare/container-engine/files/cri-dockerd-{{ cri_dockerd_version }}.{{ host_architecture }}.tgz"
  register: local_cri_dockerd
  run_once: true
  delegate_to: localhost
  become: false

- name: 下载 cri-dockerd 到 Ansible 控制机
  get_url:
    url: "{{ cri_dockerd_download_url }}"
    dest: "{{ playbook_dir }}/roles/prepare/container-engine/files/cri-dockerd-{{ cri_dockerd_version }}.{{ host_architecture }}.tgz"
    checksum: "sha256:{{ cri_dockerd_sha256[host_architecture] }}"
  run_once: true
  delegate_to: localhost
  become: false
  when: not local_cri_dockerd.stat.exists

- name: 分发 cri-dockerd 到各节点
  copy:
    src: "cri-dockerd-{{ cri_dockerd_version }}.{{ host_architecture }}.tgz"
    dest: "/tmp/cri-dockerd.tgz"

- name: 解压 cri-dockerd 安装包
  shell: >
    tar zxf /tmp/cri-dockerd.tgz -C /tmp

- name: 复制 cri-dockerd 二进制文件至 PATH 目录下
  copy:
    src: "/tmp/cri-dockerd/cri-dockerd"
    dest: "/usr/bin/cri-dockerd"
    mode: 0755
    remote_src: true

- name: 生成 cri-dockerd systemd unit 配置文件
  template:
    src: "cri-dockerd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: 0644
  with_items:
    - cri-dockerd.service
    - cri-dockerd.socket

- name: 重新加载 daemon
  systemd:
    name: cri-dockerd
    daemon_reload: true
    masked: no

- name: 重启 cri-dockerd.socket
  service:
    name: cri-dockerd.socket
    state: restarted

- name: 重启 cri-dockerd.service
  service:
    name: cri-dockerd.service
    state: restarted

- name: 设置 cri-dockerd 开机自启
  service:
    name: cri-dockerd.service
    enabled: yes
